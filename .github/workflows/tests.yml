name: Tests
on:
  push:
  pull_request:
  workflow_call:  # invoked by release.yml to gate publishing on a green test run

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'

      - name: Install Quality-Gate Tooling
        run: uv sync --only-group dev

      - name: Run Quality Gates
        run: uv run --no-sync prek run --all-files --show-diff-on-failure

  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync

      - name: Get model cache directory
        id: model-cache-dir
        run: uv run python -c "from platformdirs import PlatformDirs; print('dir=' + PlatformDirs(appname='iscc-sci', appauthor='iscc').user_data_dir)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cache ONNX model
        uses: actions/cache@v5
        with:
          path: ${{ steps.model-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-onnx-model-${{ hashFiles('iscc_sci/utils.py') }}
          restore-keys: |
            ${{ runner.os }}-onnx-model-

      - name: Run Tests
        run: uv run pytest --cov=iscc_sci --cov-report=xml -v tests
